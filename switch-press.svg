<svg id="loopable" xmlns="http://www.w3.org/2000/svg" width="560" height="640" viewBox="0 0 560 640" role="img" aria-labelledby="title desc">
  <title id="title">Wall dimmer switch press animation</title>
  <desc id="desc">A warm-white vertical dimmer switch. A finger depresses the upper paddle, the green status LED turns on, then the finger releases.</desc>

  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf9f1"/>
      <stop offset="0.56" stop-color="#e9e7dc"/>
      <stop offset="1" stop-color="#d5d2c5"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f7f6ee"/>
      <stop offset="0.55" stop-color="#e8e6db"/>
      <stop offset="1" stop-color="#d7d4c8"/>
    </linearGradient>
    <linearGradient id="buttonPressed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dedbd0"/>
      <stop offset="1" stop-color="#f2f0e6"/>
    </linearGradient>
    <radialGradient id="dial" cx="38%" cy="30%" r="72%">
      <stop offset="0" stop-color="#fbfaf3"/>
      <stop offset="0.62" stop-color="#e4e1d6"/>
      <stop offset="1" stop-color="#c9c5b9"/>
    </radialGradient>
    <linearGradient id="skin" x1="0.1" y1="0.05" x2="0.82" y2="0.85">
      <stop offset="0" stop-color="#d7ab88"/>
      <stop offset="0.44" stop-color="#bd8866"/>
      <stop offset="0.76" stop-color="#946347"/>
      <stop offset="1" stop-color="#6f4936"/>
    </linearGradient>
    <radialGradient id="nail" cx="38%" cy="28%" r="78%">
      <stop offset="0" stop-color="#e9c8b3"/>
      <stop offset="0.58" stop-color="#d2a58b"/>
      <stop offset="1" stop-color="#b47d63"/>
    </radialGradient>
    <radialGradient id="ledCore">
      <stop offset="0" stop-color="#f3ffb4"/>
      <stop offset="0.35" stop-color="#d5ff49"/>
      <stop offset="1" stop-color="#8ce500"/>
    </radialGradient>
    <filter id="deviceShadow" x="-30%" y="-20%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#181a16" flood-opacity="0.23"/>
    </filter>
    <filter id="controlInset" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.3" flood-color="#69675f" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="-1" stdDeviation="0.8" flood-color="#fff" flood-opacity="0.66"/>
    </filter>
    <filter id="fingerShadow" x="-30%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="-7" dy="13" stdDeviation="10" flood-color="#33251f" flood-opacity="0.32"/>
    </filter>
    <filter id="ledGlow" x="-500%" y="-500%" width="1100%" height="1100%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <symbol id="bulb" viewBox="0 0 36 44">
      <path d="M18 3c-8.1 0-14.4 6.1-14.4 14 0 5.4 2.5 9.1 6.3 12.4 1.7 1.5 2.5 3.4 2.5 5.4h11.2c0-2 .8-3.9 2.5-5.4 3.8-3.3 6.3-7 6.3-12.4C32.4 9.1 26.1 3 18 3Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M12.8 36.8h10.4M14.2 40.6h7.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M18 0v-4M5.8 4.7 3 1.5M30.2 4.7 33 1.5M0 17h-4M36 17h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
  </defs>

  <style>
    /* Embedded on the site as a looping stage frame (background-image), so it
       loops by default rather than only under :root:target. The ~1.2s press +
       LED happens in the first third; the rest of the 3.4s cycle idles so the
       switch presses once, calmly, per cycle instead of frantically. */
    :root { --duration: 3.4s; --iterations: infinite; }
    .upper-paddle {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: paddle var(--duration) cubic-bezier(.22,.68,.25,1) 0s var(--iterations) both;
    }
    .finger {
      transform-box: fill-box;
      transform-origin: 12% 50%;
      animation: finger var(--duration) cubic-bezier(.25,.67,.3,1) 0s var(--iterations) both;
    }
    .led-core { animation: ledCore var(--duration) steps(1,end) 0s var(--iterations) both; }
    .led-glow {
      transform-box: fill-box;
      transform-origin: center;
      animation: ledGlow var(--duration) ease-out 0s var(--iterations) both;
    }

    /* Percentages are the original 1.7s press halved onto a 3.4s cycle: the
       action lands in the first ~35%, then everything rests (paddle up, finger
       gone, LED off) for the remainder before looping. */
    @keyframes paddle {
      0%, 17% { transform: perspective(260px) rotateX(-2.4deg) translateY(3px); }
      19.7% { transform: perspective(260px) rotateX(-3.2deg) translateY(4px); }
      24.1%, 100% { transform: perspective(260px) rotateX(0deg) translateY(0); }
    }
    @keyframes finger {
      0%, 16.2% { transform: translate(0, 7px) rotate(0.8deg) scaleX(1.012); opacity: 1; }
      19.4% { transform: translate(1px, 9px) rotate(1deg) scaleX(1.018); opacity: 1; }
      22.35% { transform: translate(32px, -1px) rotate(-2deg) scaleX(1); opacity: 1; }
      27.65%, 100% { transform: translate(360px, -28px) rotate(-4deg) scaleX(1); opacity: 0; }
    }
    @keyframes ledCore {
      0%, 19.1% { opacity: .08; }
      19.4%, 34% { opacity: 1; }
      35.5%, 100% { opacity: .08; }
    }
    @keyframes ledGlow {
      0%, 18.8% { opacity: 0; transform: scale(.5); }
      20.6% { opacity: .95; transform: scale(1.2); }
      24.4%, 33.5% { opacity: .62; transform: scale(1); }
      36%, 100% { opacity: 0; transform: scale(.5); }
    }
    @media (prefers-reduced-motion: reduce) {
      .upper-paddle, .finger, .led-core, .led-glow { animation: none; }
      .finger { display: none; }
      .led-core { opacity: .08; }
      .led-glow { opacity: 0; }
    }
  </style>

  <!-- Transparent canvas: all visible pixels belong to the reusable asset. -->
  <g filter="url(#deviceShadow)">
    <rect x="116" y="30" width="308" height="574" rx="22" fill="url(#plate)" stroke="#c9c6bb" stroke-width="2"/>
    <path d="M137 53H403" stroke="#fff" stroke-opacity=".58" stroke-width="2" stroke-linecap="round"/>

    <g class="upper-paddle">
      <rect x="151" y="67" width="238" height="166" rx="3" fill="url(#buttonPressed)" stroke="#aaa69b" stroke-width="2" filter="url(#controlInset)"/>
      <path d="M157 75H383" stroke="#fff" stroke-opacity=".72" stroke-width="2"/>
      <g color="#8e8b82" opacity=".74" transform="translate(176 95)">
        <use href="#bulb" width="34" height="42"/>
      </g>
    </g>

    <g>
      <rect x="151" y="243" width="238" height="217" rx="3" fill="url(#button)" stroke="#aaa69b" stroke-width="2" filter="url(#controlInset)"/>
      <path d="M153 458 388 244M153 245H388V458" fill="none" stroke="#bab6aa" stroke-width="1.5"/>
      <path d="m182 285 9-14 9 14Z" fill="none" stroke="#99968d" stroke-width="2.7" stroke-linejoin="round" opacity=".65"/>
      <path d="m340 415 9 14 9-14Z" fill="none" stroke="#99968d" stroke-width="2.7" stroke-linejoin="round" opacity=".65"/>
      <circle cx="270" cy="351" r="54" fill="url(#dial)" stroke="#aaa69b" stroke-width="2.2" filter="url(#controlInset)"/>
      <path d="M238 321c20-20 52-21 71-3" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <g>
      <rect x="151" y="470" width="238" height="105" rx="3" fill="url(#button)" stroke="#aaa69b" stroke-width="2" filter="url(#controlInset)"/>
      <g color="#8e8b82" opacity=".68" transform="translate(177 490)">
        <use href="#bulb" width="24" height="30"/>
      </g>
    </g>

    <!-- The source LED sits just outside the upper paddle, at its upper-left. -->
    <circle cx="137" cy="100" r="4.2" fill="#3c4037" opacity=".72"/>
    <circle class="led-glow" cx="137" cy="100" r="13" fill="#b9ff31" filter="url(#ledGlow)"/>
    <circle class="led-core" cx="137" cy="100" r="6.2" fill="url(#ledCore)"/>
  </g>

  <g class="finger" filter="url(#fingerShadow)">
    <g transform="translate(0 -18)">
      <path d="M575 196C520 170 469 158 414 154l-124-9c-38-3-69 19-76 51-7 33 16 64 52 71l126 25c67 14 128 46 183 83Z" fill="url(#skin)"/>
      <path d="M575 204C517 181 468 171 414 168l-120-8c-27-2-49 10-59 31 8-29 36-47 70-44l110 8c55 4 106 16 160 41Z" fill="#efc6a7" opacity=".2"/>
      <path d="M258 165c9-4 27-4 36 1 7 4 10 10 8 17-2 8-10 13-20 15-12 2-24 0-30-6-5-5-5-11-2-17 2-4 4-7 8-10Z" fill="url(#nail)" opacity=".68"/>
      <path d="M257 174c8-7 26-9 37-3" fill="none" stroke="#f1d4c2" stroke-width="2.4" stroke-linecap="round" opacity=".5"/>
      <path d="M287 256c55 9 120 22 181 45" fill="none" stroke="#704c3a" stroke-width="2" stroke-linecap="round" opacity=".18"/>
    </g>
  </g>
</svg>
